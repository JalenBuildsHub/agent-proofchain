<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent ProofChain</title>
  <desc id="desc">Provider-neutral admission decisions and tamper-evident action receipts for AI agents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3157d5"/>
      <stop offset="1" stop-color="#6d45c6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1160" cy="-30" r="250" fill="#dce6ff" opacity="0.75"/>
  <circle cx="70" cy="650" r="260" fill="#ebe1ff" opacity="0.65"/>

  <g transform="translate(84 82)">
    <rect x="0" y="0" width="86" height="86" rx="24" fill="url(#accent)" filter="url(#shadow)"/>
    <path d="M43 18 68 29v18c0 17-10 28-25 35C28 75 18 64 18 47V29l25-11Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="m31 48 8 8 17-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="116" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="760" fill="#111b3b">Agent ProofChain</text>
    <text x="116" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" font-weight="520" fill="#52617e">Verifiable authority and evidence for AI-agent actions</text>
  </g>

  <g transform="translate(84 235)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="300" height="162" rx="24" fill="#ffffff"/>
      <rect x="34" y="32" width="48" height="48" rx="14" fill="#e7edff"/>
      <text x="58" y="66" text-anchor="middle" font-size="27" font-weight="760" fill="#3157d5">1</text>
      <text x="34" y="111" font-size="27" font-weight="720" fill="#111b3b">Authenticate</text>
      <text x="34" y="140" font-size="17" fill="#60708c">Host-bound runtime context</text>
    </g>

    <path d="M322 81h56" stroke="#7585a3" stroke-width="4" stroke-linecap="round"/>
    <path d="m365 69 14 12-14 12" fill="none" stroke="#7585a3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(400)" filter="url(#shadow)">
      <rect x="0" y="0" width="300" height="162" rx="24" fill="#ffffff"/>
      <rect x="34" y="32" width="48" height="48" rx="14" fill="#eee8ff"/>
      <text x="58" y="66" text-anchor="middle" font-size="27" font-weight="760" fill="#6d45c6">2</text>
      <text x="34" y="111" font-size="27" font-weight="720" fill="#111b3b">Decide</text>
      <text x="34" y="140" font-size="17" fill="#60708c">Default-deny capability policy</text>
    </g>

    <path d="M722 81h56" stroke="#7585a3" stroke-width="4" stroke-linecap="round"/>
    <path d="m765 69 14 12-14 12" fill="none" stroke="#7585a3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(800)" filter="url(#shadow)">
      <rect x="0" y="0" width="300" height="162" rx="24" fill="#ffffff"/>
      <rect x="34" y="32" width="48" height="48" rx="14" fill="#e7f6ef"/>
      <text x="58" y="66" text-anchor="middle" font-size="27" font-weight="760" fill="#13865c">3</text>
      <text x="34" y="111" font-size="27" font-weight="720" fill="#111b3b">Verify</text>
      <text x="34" y="140" font-size="17" fill="#60708c">Privacy-safe chained receipts</text>
    </g>
  </g>

  <g transform="translate(84 454)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="0" y="0" width="1116" height="96" rx="24" fill="#111b3b"/>
    <text x="38" y="43" font-size="21" font-weight="700" fill="#ffffff">Provider-neutral · Python + JavaScript conformance · Network-free demo</text>
    <text x="38" y="70" font-size="17" fill="#bfc9df">Open source, explicit limits, no hosted service required</text>
    <rect x="884" y="25" width="190" height="46" rx="23" fill="url(#accent)"/>
    <text x="979" y="55" text-anchor="middle" font-size="18" font-weight="720" fill="#ffffff">proofchain demo</text>
  </g>

  <text x="84" y="602" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#70809c">github.com/JalenBuildsHub/agent-proofchain</text>
</svg>
