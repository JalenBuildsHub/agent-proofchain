[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-proofchain"
version = "0.1.0"
description = "Provider-neutral admission decisions and tamper-evident action receipts for AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nymrel", email = "contact@nymrel.com" }]
maintainers = [{ name = "Nymrel" }]
keywords = [
  "ai-agents",
  "agent-security",
  "authorization",
  "audit-receipts",
  "prompt-injection",
  "provenance",
  "tamper-evidence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nymrel/agent-proofchain"
Documentation = "https://github.com/nymrel/agent-proofchain#readme"
Repository = "https://github.com/nymrel/agent-proofchain"
Issues = "https://github.com/nymrel/agent-proofchain/issues"
Changelog = "https://github.com/nymrel/agent-proofchain/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.6.0",
  "coverage==7.16.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
  "twine==7.0.0",
]

[project.scripts]
proofchain = "proofchain.cli:main"

[tool.hatch.build]
exclude = [
  "/.agent",
  "/.github",
  "/artifacts",
  "/build",
  "/dist",
  "/reports",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proofchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["proofchain"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
severity = "medium"
confidence = "medium"
