name: clean install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheel-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"

      - name: Verify wheel outside repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir clean-room
          cd clean-room
          proofchain demo --json > clean-install-demo.json
          proofchain conformance \
            --vector "$GITHUB_WORKSPACE/spec/vectors/receipt-chain-v2.json" \
            --output clean-install-conformance.json \
            > /dev/null
          python -c "import json, pathlib, proofchain;
          demo = json.loads(pathlib.Path('clean-install-demo.json').read_text(encoding='utf-8'));
          conformance = json.loads(pathlib.Path('clean-install-conformance.json').read_text(encoding='utf-8'));
          assert demo['safe_decision']['allowed'];
          assert not demo['denied_decision']['allowed'];
          assert conformance['valid'];
          assert proofchain.__version__ == '0.1.0'"

      - name: Upload clean-install evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proofchain-clean-install-${{ runner.os }}-py${{ matrix.python-version }}
          path: clean-room/
          if-no-files-found: error
