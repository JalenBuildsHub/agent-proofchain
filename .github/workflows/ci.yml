name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Run ruff with retained diagnostics
        id: ruff
        continue-on-error: true
        run: >-
          python -c "import pathlib, subprocess, sys;
          result = subprocess.run(['ruff', 'check', '.'], text=True, capture_output=True);
          pathlib.Path('artifacts').mkdir(exist_ok=True);
          pathlib.Path('artifacts/ruff.txt').write_text(result.stdout + result.stderr,
          encoding='utf-8'); print(result.stdout + result.stderr); sys.exit(result.returncode)"
      - name: Run pytest with retained diagnostics
        id: pytest
        continue-on-error: true
        run: >-
          python -c "import pathlib, subprocess, sys;
          result = subprocess.run(['pytest'], text=True, capture_output=True);
          pathlib.Path('artifacts').mkdir(exist_ok=True);
          pathlib.Path('artifacts/pytest.txt').write_text(result.stdout + result.stderr,
          encoding='utf-8'); print(result.stdout + result.stderr); sys.exit(result.returncode)"
      - run: python -m build
      - name: Run one-command demo
        run: proofchain demo
      - name: Save demo evidence
        run: >-
          python -c "import json, pathlib; from proofchain.demo import run_demo;
          pathlib.Path('artifacts').mkdir(exist_ok=True);
          pathlib.Path('artifacts/demo.json').write_text(
          json.dumps(run_demo(), indent=2, sort_keys=True) + '\n', encoding='utf-8')"
      - name: Verify portable receipt conformance vector
        run: >-
          proofchain conformance
          --vector spec/vectors/receipt-chain-v2.json
          --output artifacts/conformance-v1.json
      - name: Generate v0.2 admission evaluation evidence
        run: >-
          proofchain eval
          --policy examples/policy.json
          --fixtures evals/synthetic-v0.2.json
          --output artifacts/eval-v0.2.json
          --markdown-output artifacts/eval-v0.2.md
      - name: Generate v0.2 tamper evaluation evidence
        run: >-
          proofchain tamper-eval
          --output artifacts/tamper-v0.2.json
          --markdown-output artifacts/tamper-v0.2.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofchain-evidence-${{ runner.os }}-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
      - name: Enforce ruff result
        if: always() && steps.ruff.outcome == 'failure'
        run: exit 1
      - name: Enforce pytest result
        if: always() && steps.pytest.outcome == 'failure'
        run: exit 1
